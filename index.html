<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozlind AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="avatar">
  <div class="avatar-face">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="smile"></div>
  </div>
      </div>
      <h2>
  <span class="logo-mark">
  <span class="logo-core"></span>
  </span>
  Ozlind AI
      </h2>
      <p>Online • Premium Assistant</p>
    </div>

    <div id="chat">
      <div class="msg ai">
        Hey! 👋 I'm Ozlind AI. How can I help you today?
      </div>
    </div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Message Ozlind AI..."
      >
      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script src="chatbot.js"></script>

</body>
</html>
