<!DOCTYPE html>
<html>
<head>
  <title>Ozlind AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    #chat {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 20px 0;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 Ozlind AI</h1>

    <div id="chat">
      <p><b>Ozlind AI:</b> Hi! I'm Ozlind AI. Ask me something!</p>
    </div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Type your message..."
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script src="chatbot.js"></script>

</body>
</html>
